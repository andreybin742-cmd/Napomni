<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ежедневник</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--tx:#f4f6ff;--mut:rgba(244,246,255,.62);--acc:#7df9ff;--acc2:#c58bff;--ok:#7dffb2;--bad:#ff7d9c;--r:26px}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--tx);background:#070816;overflow-x:hidden;padding:max(20px,env(safe-area-inset-top)) 20px 40px}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;z-index:0;animation:fl 18s ease-in-out infinite alternate}
.o1{width:46vmax;height:46vmax;background:#4b2bff;left:-12vmax;top:-14vmax}
.o2{width:40vmax;height:40vmax;background:#00d4ff;right:-14vmax;top:18vh;animation-delay:-6s}
.o3{width:34vmax;height:34vmax;background:#ff3ea5;left:25vw;bottom:-18vmax;animation-delay:-11s}
@keyframes fl{to{transform:translate(6vmax,5vmax) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto}
.glass{position:relative;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 45%,rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:0 20px 50px rgba(0,0,10,.45),inset 0 1px 1px rgba(255,255,255,.6),inset 0 -12px 30px rgba(255,255,255,.04);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,20%) var(--my,0%),rgba(255,255,255,.2),transparent 60%);pointer-events:none;transition:opacity .3s}
.glass::after{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.1),transparent);transform:rotate(12deg);pointer-events:none}
.glass>*{position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 24px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.hr{display:flex;gap:10px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:600;cursor:pointer;color:var(--tx);font-family:inherit}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 12px var(--bad)}
.on .dot{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:20px}
.pad{padding:22px}
h2{font-size:17px;font-weight:800;margin-bottom:14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-h b{font-size:20px;font-weight:800;text-transform:capitalize}
.nav{display:flex;gap:8px}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:var(--tx);font-size:18px;cursor:pointer;transition:.2s;font-family:inherit}
.ib:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.wd,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.wd span{text-align:center;font-size:12px;color:var(--mut);padding-bottom:6px}
.d{aspect-ratio:1;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 15px Manrope,sans-serif;transition:.2s;position:relative}
.d:hover{background:rgba(255,255,255,.2);transform:translateY(-2px) scale(1.04);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.d.out{opacity:.35}
.d.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px rgba(125,249,255,.35)}
.d.has{background:linear-gradient(145deg,rgba(197,139,255,.35),rgba(125,249,255,.18))}
.pips{display:flex;gap:3px;height:6px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.pips i.dn{background:var(--ok)}
form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.24);background:rgba(8,10,30,.35);color:var(--tx);font:500 14px Manrope,sans-serif;outline:none;transition:.2s;color-scheme:dark}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(125,249,255,.18)}
textarea{resize:vertical;min-height:70px}
.btn{padding:13px 18px;border-radius:14px;border:0;font:800 14px Manrope,sans-serif;color:#06101c;cursor:pointer;background:linear-gradient(120deg,var(--acc),var(--acc2));box-shadow:0 10px 26px rgba(125,249,255,.3);transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.g{background:rgba(255,255,255,.12);color:var(--tx);box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.t{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.t.dn .tt{text-decoration:line-through;opacity:.5}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid rgba(255,255,255,.5);background:none;cursor:pointer;flex:none;color:#06101c;font-weight:800;margin-top:2px}
.dn .chk{background:var(--ok);border-color:var(--ok)}
.tb{flex:1;min-width:0}
.tt{font-weight:700;overflow-wrap:anywhere}
.tm{font-size:12px;color:var(--mut);margin-top:3px}
.tn{font-size:13px;margin-top:6px;color:rgba(244,246,255,.85);white-space:pre-wrap;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.x:hover{color:var(--bad)}
.empty{color:var(--mut);font-size:14px;padding:8px 2px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(4,5,16,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px}
.ov.open{display:flex}
.ov .glass{width:min(520px,100%);max-height:88vh;overflow:auto;animation:fp .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fp{from{transform:perspective(900px) rotateY(-70deg) scale(.9);opacity:0}}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120px);padding:12px 20px;border-radius:99px;background:rgba(20,22,50,.85);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(14px);z-index:30;font-weight:600;font-size:14px;transition:.35s}
.toast.show{transform:translate(-50%,0)}
.lbl{font-size:12px;color:var(--mut);margin:2px 0 -4px}
.hint{font-size:12px;color:var(--mut);line-height:1.5}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="wrap">
  <header class="glass">
    <div><h1>Ежедневник</h1><div class="sub" id="today"></div></div>
    <div class="hr"><button class="pill" id="st"><span class="dot"></span><span id="stt">Бот не подключён</span></button></div>
  </header>

  <div class="grid">
    <div class="col">
      <section class="glass pad">
        <div class="cal-h"><b id="mon"></b><div class="nav"><button class="ib" id="pv" aria-label="Назад">‹</button><button class="ib" id="tdy" aria-label="Сегодня" title="Сегодня">●</button><button class="ib" id="nx" aria-label="Вперёд">›</button></div></div>
        <div class="wd"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
        <div class="days" id="days"></div>
      </section>
    </div>
    <div class="col">
      <section class="glass pad">
        <h2>Новая задача или заметка</h2>
        <form id="f">
          <input id="ti" placeholder="Что нужно сделать?" required maxlength="140">
          <textarea id="no" placeholder="Заметка (необязательно)"></textarea>
          <div class="row"><input type="date" id="da" required><input type="time" id="tm"></div>
          <div class="lbl">Напоминание в Telegram</div>
          <select id="re">
            <option value="">Без напоминания</option>
            <option value="0">В назначенное время</option>
            <option value="10">За 10 минут</option>
            <option value="60">За 1 час</option>
            <option value="1440">За день</option>
          </select>
          <button class="btn">Добавить задачу</button>
        </form>
      </section>
      <section class="glass pad">
        <h2>Ближайшие</h2>
        <div id="up"></div>
      </section>
    </div>
  </div>
</div>

<div class="ov" id="sheet"><div class="glass pad">
  <div class="cal-h"><b id="sh"></b><button class="ib" data-close>✕</button></div>
  <div id="sl"></div>
  <button class="btn" id="sadd" style="width:100%;margin-top:6px">Добавить на этот день</button>
</div></div>

<div class="ov" id="set"><div class="glass pad">
  <div class="cal-h"><b>Telegram-бот</b><button class="ib" data-close>✕</button></div>
  <form id="sf">
    <div class="lbl">Токен бота (из @BotFather)</div>
    <input id="tk" type="password" placeholder="123456:ABC..." autocomplete="off">
    <div class="hint" id="chat"></div>
    <div class="hint" id="err" style="color:#ffb3c4"></div>
    <button class="btn">Сохранить и подключить</button>
    <button type="button" class="btn g" id="test">Отправить тест</button>
    <div class="hint">1. Вставьте токен и сохраните.<br>2. Откройте бота в Telegram и нажмите Start.<br>3. Чат подключится сам, пока эта страница открыта.<br>Токен хранится только в вашем браузере.</div>
  </form>
</div></div>

<div class="toast" id="toast"></div>

<script>
// Если репозиторий ПРИВАТНЫЙ, токен можно вписать сюда. В публичном репозитории оставьте пустым
// и введите токен в окне «Telegram-бот» на странице.
const BOT_TOKEN = "";

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let tasks=load('tasks',[]), cfg=load('cfg',{});
const save=()=>store('tasks',tasks), saveCfg=()=>store('cfg',cfg);
const token=()=>BOT_TOKEN||cfg.token||'';
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const REM={0:'в назначенное время',10:'за 10 минут',60:'за 1 час',1440:'за день'};
let view=new Date(); view.setDate(1); let sel=ymd(new Date());

const due=t=>new Date(`${t.date}T${t.time||'09:00'}`).getTime();
const nice=t=>new Date(t.date+'T00:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})+(t.time?', '+t.time:'');
const byTime=(a,b)=>due(a)-due(b);

function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}

/* ---------- рендер ---------- */
function renderCal(){
  const y=view.getFullYear(),m=view.getMonth();
  $('#mon').textContent=`${MONTHS[m]} ${y}`;
  const first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const cells=Math.ceil((off+dim)/7)*7,td=ymd(new Date());let h='';
  for(let i=0;i<cells;i++){
    const d=new Date(y,m,1-off+i),k=ymd(d),list=tasks.filter(t=>t.date===k);
    const pips=list.slice(0,4).map(t=>`<i class="${t.done?'dn':''}"></i>`).join('');
    h+=`<button class="d ${d.getMonth()!==m?'out':''} ${k===td?'today':''} ${list.length?'has':''}" data-d="${k}">${d.getDate()}<span class="pips">${pips}</span></button>`;
  }
  $('#days').innerHTML=h;
}
function taskHTML(t,full){
  return `<div class="t ${t.done?'dn':''}"><button class="chk" data-a="tg" data-id="${t.id}">${t.done?'✓':''}</button>
  <div class="tb"><div class="tt">${esc(t.title)}</div><div class="tm">${full?(t.time||'весь день'):nice(t)}${t.rem!=null?' · 🔔 '+REM[t.rem]:''}</div>${full&&t.note?`<div class="tn">${esc(t.note)}</div>`:''}</div>
  <button class="x" data-a="rm" data-id="${t.id}" aria-label="Удалить">🗑</button></div>`;
}
function renderUp(){
  const now=Date.now()-36e5,l=tasks.filter(t=>!t.done&&due(t)>=now).sort(byTime).slice(0,6);
  $('#up').innerHTML=l.length?l.map(t=>taskHTML(t,false)).join(''):'<div class="empty">Пока пусто. Добавьте первую задачу выше.</div>';
}
function renderSheet(){
  const l=tasks.filter(t=>t.date===sel).sort(byTime);
  $('#sh').textContent=new Date(sel+'T00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  $('#sl').innerHTML=l.length?l.map(t=>taskHTML(t,true)).join(''):'<div class="empty">На этот день ничего нет.</div>';
}
function renderStatus(){
  const ok=token()&&cfg.chat;
  $('#st').classList.toggle('on',!!ok);
  $('#stt').textContent=ok?'Бот подключён':token()?'Нажмите Start в боте':'Бот не подключён';
  $('#chat').textContent=cfg.chat?`Чат подключён (ID ${cfg.chat}).`:'Чат ещё не подключён.';
}
function renderAll(){renderCal();renderUp();renderStatus();if($('#sheet').classList.contains('open'))renderSheet()}

/* ---------- Telegram ---------- */
async function tg(method,body={}){
  if(!token())return null;
  try{const r=await fetch(`https://api.telegram.org/bot${token()}/${method}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json()}catch(e){return {ok:false,network:true,description:String(e)}}
}
const card=t=>`📌 <b>${esc(t.title)}</b>\n🗓 ${esc(nice(t))}${t.note?`\n📝 ${esc(t.note)}`:''}\n🔔 ${t.done?'✅ выполнено':t.rem!=null?'напомню '+REM[t.rem]:'без напоминания'}`;
const kb=t=>({inline_keyboard:[
  [{text:'⏰ За 10 мин',callback_data:`r:${t.id}:10`},{text:'⏰ За 1 час',callback_data:`r:${t.id}:60`}],
  [{text:'⏰ За день',callback_data:`r:${t.id}:1440`},{text:'⏰ В срок',callback_data:`r:${t.id}:0`}],
  [{text:'✅ Готово',callback_data:`d:${t.id}`},{text:'🗑 Удалить',callback_data:`x:${t.id}`}]]});
const menu={keyboard:[[{text:'📅 Сегодня'},{text:'📋 Ближайшие'}]],resize_keyboard:true};
const send=(text,extra={})=>cfg.chat&&tg('sendMessage',{chat_id:cfg.chat,parse_mode:'HTML',text,...extra});

async function pushTask(t){
  const r=await send(card(t),{reply_markup:kb(t)});
  if(r&&r.ok){t.msg=r.result.message_id;save()}
}
function listText(l,title){
  return l.length?`<b>${title}</b>\n\n`+l.map(t=>`${t.done?'✅':'▫️'} ${esc(nice(t))}\n<b>${esc(t.title)}</b>`).join('\n\n'):`<b>${title}</b>\n\nЗадач нет 🎉`;
}
async function handle(u){
  if(u.message){
    const m=u.message,id=m.chat.id,tx=(m.text||'').trim();
    if(!cfg.chat&&tx.startsWith('/start')){
      cfg.chat=id;saveCfg();renderStatus();toast('Telegram подключён');
      await tg('sendMessage',{chat_id:id,parse_mode:'HTML',reply_markup:menu,text:'✨ <b>Ежедневник подключён</b>\n\nНовые задачи будут приходить сюда. Под каждой есть кнопки: выберите, когда напомнить, или отметьте как выполненную.'});
      return;
    }
    if(id!==cfg.chat)return;
    const today=ymd(new Date());
    if(/сегодня|\/today/i.test(tx))send(listText(tasks.filter(t=>t.date===today).sort(byTime),'Сегодня'));
    else if(/ближайш|\/week/i.test(tx))send(listText(tasks.filter(t=>!t.done&&due(t)>=Date.now()-36e5).sort(byTime).slice(0,8),'Ближайшие задачи'));
  }
  if(u.callback_query){
    const q=u.callback_query,[a,tid,v]=q.data.split(':'),t=tasks.find(x=>x.id===tid);
    const msg={chat_id:q.message.chat.id,message_id:q.message.message_id,parse_mode:'HTML'};
    if(!t){tg('answerCallbackQuery',{callback_query_id:q.id,text:'Задача уже удалена'});return}
    if(a==='r'){t.rem=+v;t.reminded=false;t.snoozeTo=null;tg('answerCallbackQuery',{callback_query_id:q.id,text:'Напомню '+REM[t.rem]});tg('editMessageText',{...msg,text:card(t),reply_markup:kb(t)})}
    if(a==='d'){t.done=true;tg('answerCallbackQuery',{callback_query_id:q.id,text:'Готово ✅'});tg('editMessageText',{...msg,text:card(t),reply_markup:{inline_keyboard:[]}})}
    if(a==='s'){t.snoozeTo=Date.now()+36e5;t.reminded=false;tg('answerCallbackQuery',{callback_query_id:q.id,text:'Напомню через час'})}
    if(a==='x'){tasks=tasks.filter(x=>x!==t);tg('answerCallbackQuery',{callback_query_id:q.id});tg('editMessageText',{...msg,text:'🗑 Задача удалена',reply_markup:{inline_keyboard:[]}})}
    save();renderAll();
  }
}
let polling=false,offset=0;
async function poll(){
  if(polling||!token())return;polling=true;
  while(token()){
    const r=await tg('getUpdates',{offset,timeout:20,allowed_updates:['message','callback_query']});
    if(!r||!r.ok){await sleep(5000);continue}
    for(const u of r.result){offset=u.update_id+1;try{await handle(u)}catch(e){}}
  }
  polling=false;
}
const trig=t=>t.snoozeTo||due(t)-t.rem*6e4;
setInterval(()=>{
  if(!cfg.chat)return;const now=Date.now();
  tasks.forEach(t=>{
    if(t.done||t.rem==null||t.reminded||now<trig(t))return;
    t.reminded=true;save();
    send('⏰ <b>Напоминание</b>\n\n'+card(t),{reply_markup:{inline_keyboard:[[{text:'✅ Готово',callback_data:'d:'+t.id},{text:'⏳ Ещё через час',callback_data:'s:'+t.id}]]}});
  });
},15000);

/* ---------- события ---------- */
$('#f').addEventListener('submit',e=>{
  e.preventDefault();
  const r=$('#re').value;
  const t={id:Date.now().toString(36),title:$('#ti').value.trim(),note:$('#no').value.trim(),date:$('#da').value,time:$('#tm').value,rem:r===''?null:+r,done:false,reminded:false};
  tasks.push(t);save();pushTask(t);
  e.target.reset();$('#da').value=t.date;renderAll();
  toast(cfg.chat?'Задача добавлена и отправлена в Telegram':'Задача добавлена');
});
document.addEventListener('click',e=>{
  const d=e.target.closest('.d');
  if(d){sel=d.dataset.d;renderSheet();$('#sheet').classList.add('open');return}
  const a=e.target.closest('[data-a]');
  if(a){
    const t=tasks.find(x=>x.id===a.dataset.id);if(!t)return;
    if(a.dataset.a==='tg')t.done=!t.done;
    else tasks=tasks.filter(x=>x!==t);
    save();renderAll();return;
  }
  if(e.target.closest('[data-close]')||e.target.classList.contains('ov'))document.querySelectorAll('.ov').forEach(o=>o.classList.remove('open'));
});
$('#sadd').onclick=()=>{$('#da').value=sel;$('#sheet').classList.remove('open');$('#ti').focus()};
$('#pv').onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
$('#nx').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};
$('#tdy').onclick=()=>{view=new Date();view.setDate(1);renderCal()};
$('#st').onclick=()=>{$('#tk').value=BOT_TOKEN?'':cfg.token||'';$('#tk').disabled=!!BOT_TOKEN;renderStatus();$('#set').classList.add('open')};
$('#sf').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=$('#err');err.textContent='Проверяю токен…';
  if(!BOT_TOKEN){cfg.token=$('#tk').value.replace(/[\s\u200B-\u200D\uFEFF]/g,'');cfg.chat=cfg.chat||null;saveCfg()}
  const r=await tg('getMe');
  if(r&&r.ok){err.textContent='';toast('Бот @'+r.result.username+' найден. Нажмите Start в Telegram');renderStatus();poll()}
  else if(r&&r.network)err.textContent='Нет связи с api.telegram.org (сеть, блокировка или VPN). Это не ошибка токена. Детали: '+r.description;
  else err.textContent='Telegram ответил: '+(r&&r.error_code?r.error_code+' '+r.description:'нет ответа')+'. Токен неверный или отозван.';
});
$('#test').onclick=async()=>{
  if(!cfg.chat){toast('Сначала нажмите Start в боте');return}
  const r=await send('✨ Тест связи: всё работает!',{reply_markup:menu});
  toast(r&&r.ok?'Тест отправлен':'Не удалось отправить');
};
document.querySelectorAll('.glass').forEach(g=>g.addEventListener('pointermove',e=>{
  const b=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-b.left)+'px');g.style.setProperty('--my',(e.clientY-b.top)+'px');
}));

$('#today').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
$('#da').value=ymd(new Date());
renderAll();poll();
</script>
</body>
</html>
